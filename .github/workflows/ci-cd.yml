name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/Instory.slnx
      - run: dotnet build backend/Instory.slnx --no-restore -c Release
      - name: Test with coverage
        run: dotnet test backend/Instory.Tests --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage --settings backend/Instory.Tests/coverage.runsettings
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/**/coverage.cobertura.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_SIGNALR_URL: /hubs
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/deploy.sh
      - run: python3 deploy/test_deploy.py

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [backend, frontend, deployment-checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 25
    concurrency:
      group: instory-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      ARTIFACT_KEY: releases/${{ github.sha }}.tar.gz
      SECRET_ID: instory/production
      RELEASE_SHA: ${{ github.sha }}
      SITE_URL: ${{ vars.SITE_URL }}
      DATA_PROTECTION_VOLUME: instory_dataprotection_keys
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        run: |
          test -n "$AWS_REGION" && test -n "$ECR_REGISTRY" && test -n "$ECR_REPOSITORY"
          test -n "$INSTANCE_ID" && test -n "$ARTIFACT_BUCKET" && test -n "$SITE_URL"
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}"
      - name: Configure AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: instory-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable image
        run: bash deploy/push-image.sh
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - name: Package release
        run: |
          cp -r deploy release/deploy
          tar -czf release.tar.gz -C release frontend deploy
          aws s3 cp release.tar.gz "s3://$ARTIFACT_BUCKET/$ARTIFACT_KEY" --no-progress
      - name: Deploy and verify through Systems Manager
        run: python3 deploy/run-command.py
