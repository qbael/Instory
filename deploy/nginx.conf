map $http_upgrade $instory_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_cloudfront_forwarded_proto $instory_forwarded_proto {
    default $scheme;
    https https;
}

# SignalR access_token query parameters must never enter the access log.
log_format instory_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    root __APP_ROOT__/current/frontend;
    index index.html;
    access_log /var/log/nginx/instory-access.log instory_no_query;
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $instory_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $instory_connection_upgrade;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /release.txt {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
